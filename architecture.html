<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Architecture</title>
<style>
/* Figure 1 of the paper redrawn as one left-to-right pipeline. Inline SVG and CSS only.
   Every animation runs 8 s and loops; order comes from animation-delay alone. Blocks not yet
   reached stay at opacity .12 so the whole structure is always legible. Colours are the PPTX's. */

:root {
    --cycle: 8s;
    --paper: #fbfbfc;
    --ink: #1f2530;
    --mute: #7a8494;
    --rule: #a6a6a6;
    --purple: #eee9f8; --purple-edge: #b3a3d9;
    --teal: #e4f3f0;   --teal-edge: #3d9e8e;   --teal-ink: #2e8b7a;
    --beige: #faf6ee;  --beige-edge: #c9b48a;
    --blue: #c4dff2;   --blue-edge: #6fa8d6;
    --orange: #f6dbc6; --orange-edge: #d19a6e;
    --green: #cfe9d1;  --green-edge: #7fb886;
    --hard: #ec8a3c;
}
html, body { margin: 0; background: var(--paper); }
body { display: grid; place-items: center; min-height: 100vh; padding: 24px 16px; box-sizing: border-box; }
svg { width: min(100%, 1600px); height: auto; display: block;
      font-family: Georgia, "Times New Roman", serif; }

/* ---------------- shared keyframes: dim, rise, hold, fall. Only the delay differs per element. */
.stage { opacity: .12; animation: lit var(--cycle) linear infinite both; }
@keyframes lit {
    0%    { opacity: .12; }
    3%    { opacity: 1; }
    17%   { opacity: 1; }
    21%   { opacity: .12; }
    100%  { opacity: .12; }
}
/* arrows draw in as a line, hold, then fade */
.flow { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0;
        animation: draw var(--cycle) linear infinite both; }
@keyframes draw {
    0%    { stroke-dashoffset: 1; opacity: 1; }
    6%    { stroke-dashoffset: 0; opacity: 1; }
    15%   { stroke-dashoffset: 0; opacity: 1; }
    20%   { stroke-dashoffset: 0; opacity: 0; }
    100%  { stroke-dashoffset: 1; opacity: 0; }
}
.head { opacity: 0; animation: tip var(--cycle) linear infinite both; }
@keyframes tip { 0%, 5% { opacity: 0; } 7%, 15% { opacity: 1; } 20%, 100% { opacity: 0; } }
/* a faint copy of every arrow so the wiring is always visible */
.wire { stroke: var(--ink); stroke-width: 2; fill: none; opacity: .12; }

/* stage k starts at k * 0.85 s; arrows between k and k+1 start 0.55 s later */
.s0 { animation-delay: 0s; }   .a0 { animation-delay: .55s; }
.s1 { animation-delay: .85s; } .a1 { animation-delay: 1.4s; }
.s2 { animation-delay: 1.7s; } .a2 { animation-delay: 2.25s; }
.s3 { animation-delay: 2.55s; } .a3 { animation-delay: 3.1s; }
.s4 { animation-delay: 3.4s; } .a4 { animation-delay: 3.95s; }
.s5 { animation-delay: 4.25s; } .a5 { animation-delay: 4.8s; }
.s6 { animation-delay: 5.1s; } .a6 { animation-delay: 5.65s; }
.s7 { animation-delay: 5.95s; }

@media (prefers-reduced-motion: reduce) {
    .stage { animation: none; opacity: 1; }
    .flow { animation: none; stroke-dashoffset: 0; opacity: 1; }
    .head { animation: none; opacity: 1; }
    .wire { display: none; }
}

/* ---------------- drawing */
.box { stroke-width: 2; rx: 10; }
.purple { fill: var(--purple); stroke: var(--purple-edge); }
.teal   { fill: var(--teal);   stroke: var(--teal-edge); }
.beige  { fill: var(--beige);  stroke: var(--beige-edge); }
.label  { fill: var(--ink); font-size: 22px; text-anchor: middle; }
.small  { fill: var(--ink); font-size: 17px; text-anchor: middle; }
.cap    { fill: var(--mute); font-size: 16px; text-anchor: middle; letter-spacing: .04em; }
.title  { fill: var(--ink); font-size: 20px; font-weight: bold; text-anchor: middle; }
.icon   { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.flow, .head { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.head { fill: var(--ink); stroke: none; }
</style>
</head>
